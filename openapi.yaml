openapi: 3.0.3
info:
  title: Arali API
  description: API for managing customer relationships, tracking interactions, and gaining insights
  version: 1.0.0
  contact:
    name: Arali Support
    email: support@arali.ai
    url: https://arali.ai

servers:
  - url: https://api.arali.ai
    description: Production server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Enter your API key as: Api-Key <your_key>"

  parameters:
    AggGroupBy:
      name: groupBy
      in: query
      required: true
      schema:
        type: string
      description: >
        Dimension(s) to group by. Single dimension: `stage`, `owner`, `org_unit`, or
        `field:<fieldKey>` (deals also support `pipeline`). Compound mode: comma-separate
        multiple dimensions (`stage` and/or `field:<fieldKey>` only, deals also `pipeline`)
        to get one cross-tabbed result instead of a single breakdown, e.g.
        `stage,field:country,field:lead_source`.
      example: "field:lead_source"
    AggStageKey:
      name: stageKey
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated stage keys to filter to before grouping.
    AggStageId:
      name: stageId
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated stage UUIDs to filter to before grouping.
    AggFields:
      name: fields[fieldKey]
      in: query
      required: false
      schema:
        type: string
      description: >
        Filter to entities whose custom field `fieldKey` matches `value` (exact/ILIKE
        match). Repeatable — one per field key, e.g. `fields[ethnicity]=NRI`. AND-combined
        if multiple are given.
    AggFieldsAfter:
      name: fieldsAfter[fieldKey]
      in: query
      required: false
      schema:
        type: string
        format: date
      description: >
        Filter to entities whose custom `date`/`datetime` field `fieldKey` is on or after
        this date (inclusive). Only valid for date/datetime-typed custom fields — returns
        400 for any other field type. Pair with `fieldsBefore[fieldKey]` for a range.
      example: "fieldsAfter[created_at_cy]=2026-06-01"
    AggFieldsBefore:
      name: fieldsBefore[fieldKey]
      in: query
      required: false
      schema:
        type: string
        format: date
      description: >
        Filter to entities whose custom `date`/`datetime` field `fieldKey` is strictly
        before this date. Only valid for date/datetime-typed custom fields.
      example: "fieldsBefore[created_at_cy]=2026-07-01"
    AggKeyRoleUserId:
      name: key_role_user_id
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated user UUIDs. Filter to entities owned by any of these users.
    AggKeyRoleKey:
      name: key_role_key
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated key-role keys (e.g. `ae`, `csm`) to scope `key_role_user_id`/`org_unit_id`/`groupBy=owner`/`groupBy=org_unit` to specific roles only.
    AggOrgUnitId:
      name: org_unit_id
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated org unit UUIDs. Filter to entities owned by someone in these org units (or their descendants).
    AggDate:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: "Shorthand for \"that single day\" — filters to entities whose system `createdAt` falls on this UTC date. Mutually exclusive with `createdAfter`/`createdBefore`."
      example: "2026-07-20"
    AggCreatedAfter:
      name: createdAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter to entities with system `createdAt` on or after this ISO date/datetime.
    AggCreatedBefore:
      name: createdBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Filter to entities with system `createdAt` strictly before this ISO date/datetime.
    AggGranularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [day, month]
        default: day
      description: Bucket size when `groupBy` (or a compound dimension) targets a `date`/`datetime` custom field. Defaults to `day`.

  schemas:
    AggregateGroupCount:
      type: object
      properties:
        groupKey:
          type: string
          nullable: true
          description: The raw group value (stage/user/org-unit UUID, or field value). `null` for the "no value" bucket.
        groupLabel:
          type: string
          description: Human-readable label — resolved stage/user/org-unit name, or the raw field value/date bucket.
        count:
          type: integer
          description: Number of entities in this group. For `owner`/`org_unit`/`multi_enum` field dimensions, an entity can appear in more than one group (fan-out) — see description.
      example:
        groupKey: "1bd05980-ea79-433f-8bcd-2d6114b6e2aa"
        groupLabel: "Customer"
        count: 137

    AggregateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AggregateGroupCount'
        meta:
          type: object
          properties:
            entity:
              type: string
              example: "contacts"
            groupBy:
              type: string
              example: "stage"
            total:
              type: integer
              description: Accurate distinct-entity count matching the applied filters. Can be less than `sum(data[].count)` for `owner`/`org_unit`/`multi_enum` dimensions — that's intentional fan-out, not a bug.
            enterpriseId:
              type: string
              format: uuid

    CompoundAggregateRow:
      type: object
      properties:
        dimensions:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: One key per requested dimension token (e.g. `stage`, `field:country`), value is that combination's group value (or `null`).
        count:
          type: integer
      example:
        dimensions:
          stage: "New"
          country: "United States"
        count: 19

    CompoundAggregateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompoundAggregateRow'
        meta:
          type: object
          properties:
            entity:
              type: string
            groupBy:
              type: string
              example: "stage,field:country"
            dimensions:
              type: array
              items:
                type: string
            total:
              type: integer
            enterpriseId:
              type: string
              format: uuid

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details
        schema:
          type: string
          description: Reference to schema endpoint

    BatchResponse:
      type: object
      properties:
        success:
          type: boolean
        summary:
          type: object
          properties:
            total:
              type: integer
            success:
              type: integer
            failed:
              type: integer
        results:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum: [success, skipped, error]
              reason:
                type: string
            additionalProperties: true
            description: Result items include endpoint-specific IDs (e.g. externalCompanyId/companyId, externalContactId/contactId, externalAccountId/accountId)

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enterpriseId:
          type: string
          format: uuid
        name:
          type: string
          description: Company display name
          example: "Acme Corporation"
        domain:
          type: string
          nullable: true
          description: Company website domain
          example: "acme.com"
        ownerUserId:
          type: string
          format: uuid
          nullable: true
          description: Owner user ID
        healthScore:
          type: integer
          nullable: true
          description: Health score (0-100)
        healthScoreComputedAt:
          type: string
          format: date-time
          nullable: true
        healthScoreBreakdown:
          type: object
          nullable: true
        ARR:
          type: integer
          nullable: true
          description: Annual Recurring Revenue
        currency:
          type: string
          default: USD
        stageDefinitionId:
          type: string
          format: uuid
          nullable: true
        attributes:
          type: object
          description: Custom key-value attributes
        externalCompanyId:
          type: string
          nullable: true
          description: External Company ID stored on companies.external_company_id and used for idempotent upserts.
          example: "hubspot_12345"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stage:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
            name:
              type: string
            bucket:
              type: string
            scope:
              type: string
        fieldValues:
          type: array
          items:
            type: object
            properties:
              fieldKey:
                type: string
              fieldName:
                type: string
              fieldType:
                type: string
                enum: [text, number, date, boolean, json, enum]
              value:
                description: The field value (type depends on fieldType)
        contacts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              fullName:
                type: string
              title:
                type: string
              emails:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                    isPrimary:
                      type: boolean
              phones:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    phone:
                      type: string
                    isPrimary:
                      type: boolean
        deals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              amountCents:
                type: number
                nullable: true
              currency:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  pipelineId:
                    type: string
                    format: uuid
                  sortOrder:
                    type: integer
              pipeline:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  isActive:
                    type: boolean
        accounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              domain:
                type: string
              accountType:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  bucket:
                    type: string
                  scope:
                    type: string

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enterpriseId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          description: Account display name
          example: "Acme Enterprise Account"
        domain:
          type: string
          nullable: true
          description: Account domain
        accountType:
          type: string
          nullable: true
          description: Account type/tier
          example: "enterprise"
        ownerUserId:
          type: string
          format: uuid
          nullable: true
          description: Owner user ID
        stageDefinitionId:
          type: string
          format: uuid
          nullable: true
        healthScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Health score (0-100)
        healthScoreComputedAt:
          type: string
          format: date-time
          nullable: true
        healthScoreBreakdown:
          type: object
          nullable: true
        ARR:
          type: integer
          nullable: true
          description: Annual Recurring Revenue
        currency:
          type: string
          default: USD
        externalAccountId:
          type: string
          nullable: true
          description: External Account ID stored on accounts.external_id and used for idempotent upserts.
          example: "CRM_ACC_001"
        externalCompanyId:
          type: string
          nullable: true
          description: Native external ID of the parent company from companies.external_company_id
          example: "hubspot_12345"
        metadata:
          type: object
          description: Custom key-value metadata
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stage:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
            name:
              type: string
            bucket:
              type: string
            scope:
              type: string
        fieldValues:
          type: array
          items:
            type: object
            properties:
              fieldKey:
                type: string
              fieldName:
                type: string
              fieldType:
                type: string
                enum: [text, number, date, boolean, json, enum]
              value:
                description: The field value (type depends on fieldType)
        company:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            domain:
              type: string
            stage:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                key:
                  type: string
                name:
                  type: string
                bucket:
                  type: string
                scope:
                  type: string
            fieldValues:
              type: array
              items:
                type: object
                properties:
                  fieldKey:
                    type: string
                  fieldName:
                    type: string
                  fieldType:
                    type: string
                  value:
                    description: The field value (type depends on fieldType)
        contacts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              fullName:
                type: string
              title:
                type: string
              emails:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                    isPrimary:
                      type: boolean
              phones:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    phone:
                      type: string
                    isPrimary:
                      type: boolean
        deals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  pipelineId:
                    type: string
                    format: uuid
                  sortOrder:
                    type: integer
              pipeline:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  isActive:
                    type: boolean

    ContactUpsert:
      type: object
      required:
        - fullName
      properties:
        externalContactId:
          type: string
          nullable: true
          description: External unique ID stored on contacts.external_contact_id. Optional — if omitted, a new contact is created without an external ID.
          example: "hubspot_contact_12345"
        fullName:
          type: string
          nullable: true
          description: Contact's full name
          example: "John Doe"
        title:
          type: string
          nullable: true
          description: Job title
          example: "VP of Engineering"
        ownerUserId:
          type: string
          format: uuid
          nullable: true
          description: Owner user UUID
        emails:
          type: array
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
              isPrimary:
                type: boolean
                default: false
              label:
                type: string
                nullable: true
        phones:
          type: array
          items:
            type: object
            required:
              - phone
            properties:
              phone:
                type: string
              isPrimary:
                type: boolean
                default: false
              label:
                type: string
                nullable: true
        attributes:
          type: object
        properties:
          type: object
          description: Custom field values (key-value pairs)
        stageDefinitionId:
          type: string
          format: uuid
          nullable: true
          description: Stage definition UUID to assign to the contact
        stageKey:
          type: string
          nullable: true
          description: Stage key to assign to the contact (alternative to stageDefinitionId)
        key_roles:
          type: array
          items:
            type: object
            description: Key role assignments for this contact
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Override creation timestamp (optional, for backfills)

    ContactUpdate:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
          description: Contact's full name
        title:
          type: string
          nullable: true
          description: Job title
        ownerUserId:
          type: string
          format: uuid
          nullable: true
          description: Owner user UUID
        emails:
          type: array
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
              isPrimary:
                type: boolean
                default: false
              label:
                type: string
                nullable: true
        phones:
          type: array
          items:
            type: object
            required:
              - phone
            properties:
              phone:
                type: string
              isPrimary:
                type: boolean
                default: false
              label:
                type: string
                nullable: true
        attributes:
          type: object
        properties:
          type: object

    ListContact:
      type: object
      description: Lightweight contact object returned by GET /api/v1/contacts
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
          description: Contact's full name
        title:
          type: string
          nullable: true
          description: Job title
        stageName:
          type: string
          nullable: true
          description: Current contact stage name
        externalContactId:
          type: string
          nullable: true
        emails:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              contactId:
                type: string
                format: uuid
              enterpriseId:
                type: string
                format: uuid
              email:
                type: string
              isPrimary:
                type: boolean
              label:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        phones:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              contactId:
                type: string
                format: uuid
              enterpriseId:
                type: string
                format: uuid
              phone:
                type: string
              phoneNormalized:
                type: string
                nullable: true
              isPrimary:
                type: boolean
              label:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastAssignedAt:
          type: string
          format: date-time
          nullable: true

    Contact:
