            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDefinition'
      responses:
        '200':
          description: Metric definition updated
        '404':
          description: Metric definition not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:write scope

    delete:
      operationId: deleteMetricDefinition
      summary: Delete Metric Definition
      description: Delete a metric definition
      tags:
        - Metric Definitions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metric definition deleted
        '404':
          description: Metric definition not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:delete scope

