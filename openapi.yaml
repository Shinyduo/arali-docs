      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contacts
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactUpsert'
            example:
              contacts:
                - externalContactId: "contact_12345"
                  fullName: "John Doe"
                  title: "VP of Engineering"
                  emails:
                    - email: "john.doe@acme.com"
                      isPrimary: true
                      label: "Work"
                  phones:
                    - phone: "+1-555-123-4567"
                      isPrimary: true
                      label: "Mobile"
                  attributes:
                    linkedin: "https://linkedin.com/in/johndoe"
                    timezone: "America/New_York"
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires contacts:write scope

    get:
      operationId: listContacts
      summary: List Contacts
      description: Get all contacts for your enterprise
      tags:
        - Contacts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number to return
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: "Number of contacts to return per page (max: 200)"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by contact name, title, external contact ID, email, phone, or normalized phone
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Alias for search
        - name: phone
          in: query
          required: false
          schema:
            type: string
          description: Exact phone lookup using digits-only normalization
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Exact email lookup
        - name: company_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by company UUID
        - name: stage
          in: query
          required: false
          schema:
            type: string
          description: Filter by contact stage key or stage definition UUID
        - name: key_role_user_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by assigned key-role user UUID. Supports comma-separated values.
        - name: key_role_key
          in: query
          required: false
          schema:
            type: string
          description: Filter by key role key. Supports comma-separated values.
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListContact'
                  meta:
                    type: object
                    properties:
                      entity:
                        type: string
                        example: contacts
                      total:
                        type: integer
                        description: Total number of matching contacts
                      count:
                        type: integer
                        description: Number of contacts returned in this response
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
                      hasMore:
                        type: boolean
                      enterpriseId:
                        type: string
                        format: uuid
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires contacts:read scope

  /api/v1/contacts/aggregate:
    get:
      operationId: aggregateContacts
      summary: Aggregate Contacts
      description: >
        Group contacts by stage, owner, org unit, or a custom field, returning a count
        per group. Custom field grouping supports `text`, `number`, `boolean`, `enum`,
        `multi_enum` (an entity with 2+ selected values is counted once per value), and
        `date`/`datetime` (bucketed via `granularity`). Pass a comma-separated `groupBy`
        (e.g. `stage,field:ad_id,field:country`) for a compound cross-tab — one row per
        combination — instead of a single breakdown. Filters compose with any `groupBy`
        choice, e.g. filter to a stage/date range then group by a different dimension.
      tags:
        - Contacts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AggGroupBy'
        - $ref: '#/components/parameters/AggStageKey'
        - $ref: '#/components/parameters/AggStageId'
        - $ref: '#/components/parameters/AggFields'
        - $ref: '#/components/parameters/AggFieldsAfter'
        - $ref: '#/components/parameters/AggFieldsBefore'
        - $ref: '#/components/parameters/AggKeyRoleUserId'
        - $ref: '#/components/parameters/AggKeyRoleKey'
        - $ref: '#/components/parameters/AggOrgUnitId'
        - $ref: '#/components/parameters/AggDate'
        - $ref: '#/components/parameters/AggCreatedAfter'
        - $ref: '#/components/parameters/AggCreatedBefore'
        - $ref: '#/components/parameters/AggGranularity'
      responses:
        '200':
          description: Group counts (or cross-tabbed rows, if `groupBy` was comma-separated)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AggregateResponse'
                  - $ref: '#/components/schemas/CompoundAggregateResponse'
        '400':
          description: Invalid groupBy, unknown field key, unsupported field type for grouping, or compound mode has too many distinct combinations (over 500) to return reliably
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires contacts:read scope

  /api/v1/contacts/{id}:
