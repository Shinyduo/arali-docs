        '404':
          description: Call not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires calls:read scope

  # Meetings
  /api/v1/meetings:
    post:
      operationId: createMeeting
      summary: Create/Update Meeting
      description: Create or update a meeting record
      tags:
        - Meetings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meeting'
            example:
              title: "Weekly Team Sync"
              channel: "gmeet"
              joinUrl: "https://meet.google.com/abc-defg-hij"
              scheduledStartAt: "2024-01-20T10:00:00Z"
              scheduledEndAt: "2024-01-20T11:00:00Z"
              status: "scheduled"
              externalMeetingId: "calendar_event_abc123"
              hostEmail: "john@example.com"
              participantEmails:
                - "john@example.com"
                - "jane@example.com"
              type: "internal"
      responses:
        '200':
          description: Meeting created/updated
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires meetings:write scope

    get:
      operationId: listMeetings
      summary: List Meetings
      description: Get all meetings for your enterprise
      tags:
        - Meetings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of meetings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires meetings:read scope

  /api/v1/meetings/{id}:
    get:
      operationId: getMeeting
      summary: Get Meeting
