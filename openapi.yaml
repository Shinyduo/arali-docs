          default: unknown
        status:
          type: string
          enum: [completed, missed, voicemail, failed, busy, cancelled, unknown]
          default: completed
        fromNumber:
          type: string
          nullable: true
          description: Phone number the call originated from
        toNumber:
          type: string
          nullable: true
          description: Phone number the call was made to
        durationSeconds:
          type: number
          nullable: true
          description: Call duration in seconds
        ringDurationSeconds:
          type: number
          nullable: true
        startTimestamp:
          type: string
          format: date-time
          nullable: true
        endTimestamp:
          type: string
          format: date-time
          nullable: true
        recordingUrl:
          type: string
          nullable: true
