            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  bucket:
                    type: string
                  scope:
                    type: string

    Association:
      type: object
      properties:
        contactId:
          type: string
          format: uuid
          description: Internal UUID of the contact
        externalContactId:
          type: string
          description: Native contact external ID from contacts.external_contact_id
        companyId:
          type: string
          format: uuid
          description: Internal UUID of the company
        externalCompanyId:
          type: string
          description: Native company external ID from companies.external_company_id
        accountId:
          type: string
          format: uuid
          description: Internal UUID of the account
        externalAccountId:
          type: string
          description: Native account external ID from accounts.external_id
        relation:
          type: string
          enum: [employee, consultant, contractor, partner, agency, other]
          default: employee
        isPrimary:
          type: boolean
          default: false
        role:
          type: string
          description: Role for contact_account association
        dealId:
          type: string
          format: uuid
          description: Internal UUID of the deal (optional if externalDealId provided)
        externalDealId:
          type: string
          description: Native deal external ID from deals.external_deal_id (optional if dealId provided)
        dealRole:
          type: string
          description: Role for the deal_contact association (e.g. champion, decision_maker, economic_buyer)
          default: unknown

    AssociationResponse:
      type: object
      properties:
        success:
          type: boolean
        entityType:
          type: string
          enum: [contact, deal, company, account]
        entityId:
          type: string
          format: uuid
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        deals:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        company:
          $ref: '#/components/schemas/Company'
        account:
          $ref: '#/components/schemas/Account'
      description: >
        Returns related entities based on entityType.
        - contact → companies[], deals[], accounts[]
        - deal → contacts[], company, account
        - company → contacts[], deals[], accounts[]
        - account → contacts[], deals[], company

    Call:
