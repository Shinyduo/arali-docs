          description: Page number to return
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: lifecycleStage
          in: query
          schema:
            type: string
            enum: [open, won, lost, cancelled]
          description: Filter by deal lifecycle stage
        - name: ownerUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of deals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deal'
                  meta:
                    type: object
                    properties:
                      entity:
                        type: string
                        example: deals
                      enterpriseId:
                        type: string
                        format: uuid
                      total:
                        type: integer
                        description: Total number of matching deals
                      count:
                        type: integer
                        description: Number of deals returned in this response
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
                      hasMore:
                        type: boolean
                      search:
                        type: object
                        properties:
                          q:
                            type: string
                            nullable: true
                          contactName:
                            type: string
                            nullable: true
                          contactPhone:
                            type: string
                            nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires deals:read scope

  /api/v1/deals/aggregate:
    get:
      operationId: aggregateDeals
      summary: Aggregate Deals
      description: >
        Group deals by stage, pipeline, owner, org unit, or a custom field, returning a
        count per group. Deals use a different stage model than companies/accounts/contacts
        (`deal_pipeline_stage` scoped to a `deal_pipeline`) — the returned stage label is
        disambiguated with the pipeline name, e.g. `"Customer (Default)"`. Pass a
        comma-separated `groupBy` (e.g. `stage,pipeline` or `field:ad_id,field:country`)
        for a compound cross-tab instead of a single breakdown. Filters compose with any
        `groupBy` choice.
      tags:
        - Deals
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AggGroupBy'
        - name: pipelineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to deals in this pipeline. Also scopes `stageKey` resolution to this pipeline's stages.
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to deals for this company.
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to deals for this account.
        - $ref: '#/components/parameters/AggStageKey'
        - $ref: '#/components/parameters/AggStageId'
        - $ref: '#/components/parameters/AggFields'
        - $ref: '#/components/parameters/AggFieldsAfter'
        - $ref: '#/components/parameters/AggFieldsBefore'
        - $ref: '#/components/parameters/AggKeyRoleUserId'
        - $ref: '#/components/parameters/AggKeyRoleKey'
        - $ref: '#/components/parameters/AggOrgUnitId'
        - $ref: '#/components/parameters/AggDate'
        - $ref: '#/components/parameters/AggCreatedAfter'
        - $ref: '#/components/parameters/AggCreatedBefore'
        - $ref: '#/components/parameters/AggGranularity'
      responses:
        '200':
          description: Group counts (or cross-tabbed rows, if `groupBy` was comma-separated)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AggregateResponse'
                  - $ref: '#/components/schemas/CompoundAggregateResponse'
        '400':
          description: Invalid groupBy, unknown field key, unsupported field type for grouping, or compound mode has too many distinct combinations (over 500) to return reliably
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires deals:read scope

