  /api/v1/metric-computations:
    post:
      operationId: ingestMetricComputations
      summary: Ingest Metric Computations
      description: Batch ingest metric computation records
      tags:
        - Metric Computations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - computations
              properties:
                computations:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetricComputation'
      responses:
        '200':
          description: Batch operation completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:computations:write scope

    get:
      operationId: queryMetricComputations
      summary: Query Metric Computations
      description: Query metric computation records
      tags:
        - Metric Computations
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: metricId
          in: query
          schema:
            type: string
            format: uuid
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: eventKey
          in: query
          schema:
            type: string
        - name: startAt
          in: query
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of metric computations
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:computations:read scope

