  /api/v1/fields/values:
    get:
      operationId: getFieldValues
      summary: Get Field Values
      description: Get field values for an entity
      tags:
        - Fields
      security:
        - BearerAuth: []
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [company, account, contact]
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Entity UUID
      responses:
        '200':
          description: Field values for the entity
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires fields:read scope

    post:
      operationId: setFieldValues
      summary: Set Field Values
      description: Set field values for an entity
      tags:
        - Fields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityType
                - entityId
                - fields
              properties:
                entityType:
                  type: string
                  enum: [company, account, contact]
                entityId:
                  type: string
                  format: uuid
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldValue'
      responses:
        '200':
          description: Field values set
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires fields:write scope

  /api/v1/fields/values/batch:
    post:
      operationId: batchSetFieldValues
      summary: Batch Set Field Values
      description: Set field values for multiple entities
      tags:
        - Fields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityType
                - entities
              properties:
                entityType:
                  type: string
                  enum: [company, account, contact]
                entities:
                  type: array
                  items:
                    type: object
                    required:
                      - entityId
                      - fields
                    properties:
                      entityId:
                        type: string
                        format: uuid
                      fields:
                        type: array
                        items:
                          $ref: '#/components/schemas/FieldValue'
      responses:
        '200':
          description: Batch operation completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires fields:write scope

  # Users
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List Users
      description: List all users in your enterprise. Optionally filter by name or email using the `search` param.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on name or email
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires users:read scope

  /api/v1/users/{id}:
    get:
      operationId: getUser
      summary: Get User
      description: Get a single user by their ID
      tags:
