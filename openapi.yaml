      operationId: createMetricDefinitions
      summary: Create/Update Metric Definitions
      description: Batch create or update metric definitions
      tags:
        - Metric Definitions
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metricDefinitions
              properties:
                metricDefinitions:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetricDefinition'
      responses:
        '200':
          description: Batch operation completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:write scope

    get:
      operationId: listMetricDefinitions
      summary: List Metric Definitions
      description: Get all metric definitions for your enterprise
      tags:
        - Metric Definitions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of metric definitions
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:read scope

  /api/v1/metric-definitions/{id}:
    get:
      operationId: getMetricDefinition
      summary: Get Metric Definition
      description: Get a single metric definition by ID
      tags:
        - Metric Definitions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metric definition details
        '404':
          description: Metric definition not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:read scope

    delete:
      operationId: deleteMetricDefinition
      summary: Delete Metric Definition
      description: Delete a metric definition
      tags:
        - Metric Definitions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metric definition deleted
        '404':
          description: Metric definition not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires metrics:definitions:delete scope

