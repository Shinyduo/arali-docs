      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - associations
              properties:
                associations:
                  type: array
                  items:
                    $ref: '#/components/schemas/Association'
            example:
              associations:
                - externalContactId: "contact_12345"
                  externalCompanyId: "company_67890"
                  relation: "employee"
                  isPrimary: true
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires associations:write scope

  # Calls
  /api/v1/calls:
    post:
      operationId: createCalls
      summary: Create Calls
      description: Batch create call records
      tags:
        - Calls
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - calls
              properties:
                calls:
                  type: array
                  items:
                    $ref: '#/components/schemas/Call'
            example:
              calls:
                - externalCallId: "call_12345"
                  direction: "inbound"
                  status: "completed"
                  fromNumber: "+1-555-123-4567"
                  toNumber: "+1-555-987-6543"
                  durationSeconds: 300
                  startTimestamp: "2024-01-15T10:00:00Z"
                  endTimestamp: "2024-01-15T10:05:00Z"
                  recordingUrl: "https://recordings.example.com/call_12345.mp3"
                  customer:
                    phone: "+1-555-123-4567"
                    name: "John Doe"
                    email: "john.doe@acme.com"
                  title: "Sales Follow-up Call"
      responses:
        '200':
          description: Batch operation completed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires calls:write scope

    get:
      operationId: listCalls
      summary: List Calls
      description: Get all call records for your enterprise
      tags:
        - Calls
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of calls
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires calls:read scope

  /api/v1/calls/{id}:
    get:
      operationId: getCall
      summary: Get Call
      description: Get a single call record by ID
      tags:
        - Calls
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Call UUID
      responses:
        '200':
