          type: string
          format: uuid
        enterpriseId:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
          description: Contact's full name
        title:
          type: string
          nullable: true
          description: Job title
        ownerUserId:
          type: string
          format: uuid
          nullable: true
          description: Owner user UUID
        toAnalyze:
          type: boolean
        stageDefinitionId:
          type: string
          format: uuid
          nullable: true
        attributes:
          type: object
        externalContactId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stage:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
            name:
              type: string
            bucket:
              type: string
            scope:
              type: string
        fieldValues:
          type: array
          items:
            type: object
            properties:
              fieldKey:
                type: string
              fieldName:
                type: string
              fieldType:
                type: string
                enum: [text, number, date, boolean, json, enum]
              value:
                description: The field value (type depends on fieldType)
        emails:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
              isPrimary:
                type: boolean
        phones:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              phone:
                type: string
              isPrimary:
                type: boolean
        companies:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              domain:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  bucket:
                    type: string
                  scope:
                    type: string
              fieldValues:
                type: array
                items:
                  type: object
                  properties:
                    fieldKey:
                      type: string
                    fieldName:
                      type: string
                    fieldType:
                      type: string
                    value:
                      description: The field value (type depends on fieldType)
        deals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              stage:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
                  pipelineId:
                    type: string
                    format: uuid
                  sortOrder:
                    type: integer
              pipeline:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
